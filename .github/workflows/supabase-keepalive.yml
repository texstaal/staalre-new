name: Supabase keep-alive

# Free-tier Supabase projects pause when they look inactive, which takes down the website
# forms and the CRM. In October 2026 a read-only ping every 3 days was NOT enough, so this
# now runs daily and makes a real write: the keepalive_ping() function updates one row in
# public.keepalive. The key below is the PUBLIC anon key (already shipped in js/forms.js);
# it can only call that function, not read or change any other data.
#
# If the ping fails, the job opens (or comments on) an issue assigned to the repo owner,
# so GitHub emails an alert. The issue is closed automatically once a ping succeeds again.

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: read
  issues: write

env:
  ALERT_TITLE: 'Supabase keep-alive failed: website forms and CRM may be down'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (real write)
        run: |
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZsd3ZsbXl4Y3JjdmxwbmZsdWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NTM3MTAsImV4cCI6MjA5NzAyOTcxMH0.6lObN4e-9cJVRAvZsCdJ0kBn0iNctUZJkegl01NCUD4"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
              "https://vlwvlmyxcrcvlpnfluch.supabase.co/rest/v1/rpc/keepalive_ping" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" -d '{}' || echo 000)
            echo "Attempt $attempt: HTTP $code $(cat /tmp/body 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "Supabase did not accept the keep-alive write"; exit 1

      - name: Alert by GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="The daily Supabase keep-alive failed ($RUN_URL).

          The project may be paused, which means website enquiries and the CRM login fail.
          Check the project in the Supabase dashboard and restore it if it is paused."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ALERT_TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi

      - name: Close alert once healthy again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$ALERT_TITLE\" in:title" --json number -q '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Keep-alive succeeded again; closing."
          done
